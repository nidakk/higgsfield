# Account roster for the 5-account TikTok Shop growth network.
#
# Daily output currently lands in Google Drive, not TikTok directly (see
# docs/production_pipeline.md, step 6). `drive_folder_id` is the Drive
# folder ID for that account's root folder, created once and reused for
# every day's subfolder.
#
# `handle` and `connector_id` stay null until you're ready to connect
# TikTok and start publishing directly (docs/production_pipeline.md,
# step 7 — deferred). `connector_id` is returned by the tiktok_accounts
# MCP tool once connected.
#
# Each account has its OWN distinct avatar (a different woman, 35+,
# photoreal, per account — not one identity reused across accounts).
# Consistency happens WITHIN an account, not across them: each account's
# `avatar.reference_media_id` is generated/supplied once (docs/production_pipeline.md,
# step 0) and then reused as the identity input for every single video
# posted to that account from then on, so the same woman appears in
# video 1 and video 200 alike. Null until step 0 runs for that account.
#
# `reference_type` (image|video) says which medias role to pass
# `reference_media_id` as in generate_video (seedance_2_0):
# "image_references" for a generated portrait, "video_references" for a
# user-supplied video reference (e.g. Skincare, sourced from an existing
# video rather than a generated portrait).

follower_goal: 5000
posts_per_day: 3
phase2_sell_ratio: 0.3  # fraction of Phase 2 posts that are shop-adjacent

drive_root_folder_id: null  # "TikTok Shop Growth" root folder, set once created

accounts:
  - id: moms
    niche: Moms
    # General "mom" audience, not just moms of young kids — pillars
    # should span every stage (newborn through empty nest), not just
    # toddler/little-kid content.
    handle: null
    connector_id: null
    drive_folder_id: null
    phase: growth
    aesthetic: "soft natural light, cozy home interiors, warm muted palette"
    avatar:
      description: "Woman, mid-to-late 30s, warm and approachable — 'the friend who's been there'"
      hair: "loose waves or a relaxed low bun"
      wardrobe: "soft knit cardigan, warm everyday styling"
      source_reference: null  # media_id once a reference photo is supplied (optional)
      reference_media_id: "0ec51516-bcd4-41dc-ac71-39310a0b50d8"  # approved candidate, soul_cast
      reference_type: image  # pass as role "image_references" in generate_video (seedance_2_0)
    pillars:
      - daily overwhelm and mom guilt
      - parenting hacks for every age and stage
      - quick wins for exhausted parents
      - "\"you're not failing\" reassurance"
      - the identity shift of motherhood, new mom to empty nest
    posting_times: ["08:00", "13:00", "19:00"]

  - id: skincare
    niche: Skincare
    handle: null
    connector_id: null
    drive_folder_id: null
    phase: growth
    aesthetic: "macro product/texture shots, clean bright bathroom counters, minimal palette"
    avatar:
      description: "Woman, late 30s, polished and clinical-credible"
      hair: "sleek, straight or slicked back"
      wardrobe: "minimal neutral top, clean/polished styling"
      source_reference: "2178255b-4a8e-42a1-8fe4-a4d5e5df01cd"  # user-supplied video, previously generated by Higgsfield for another project
      reference_media_id: "2178255b-4a8e-42a1-8fe4-a4d5e5df01cd"  # locked identity reference
      reference_type: video  # pass as role "video_references" in generate_video (seedance_2_0), not "image_references"
    pillars:
      - ingredient myths and mistakes
      - routine simplification
      - "why your skin isn't improving"
      - budget dupes and layering order
      - skin-barrier repair basics
    posting_times: ["09:00", "14:00", "20:00"]

  - id: self_care
    niche: Self-care
    handle: null
    connector_id: null
