      reference_media_id: "52e8e53b-b7d6-4857-9ab7-27b60398418c"  # locked identity reference — replaces prior video reference (2178255b-4a8e-42a1-8fe4-a4d5e5df01cd), which did not match the approved identity
      reference_type: image  # pass as role "image_references" in generate_video (seedance_2_0)
